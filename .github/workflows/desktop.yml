name: Desktop app

# Builds SchoolBoard for macOS (Apple silicon and Intel) and Windows, checks each one starts, and uploads the
# downloads. Pushing a tag like v1.0.0 also publishes them as a GitHub Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["app/**", "desktop/**", "desktop.py", "requirements*.txt", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14   # Apple silicon
          - os: macos-13   # Intel
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-desktop.txt
      - run: python desktop/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: SchoolBoard-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/SchoolBoard-*.zip
          if-no-files-found: error
          retention-days: 30
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SchoolBoard-*.zip
